<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060e"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#050813"/>
    </linearGradient>

    <radialGradient id="globeGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerGreenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161d2d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c101c" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="heroCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182333" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b1320" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-rose" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatCenter {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes floatLeft1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatLeft2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatRight1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6.5px); }
    }
    @keyframes floatRight2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5.5px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(0.98); }
      50% { opacity: 0.85; transform: scale(1.04); }
    }
    @keyframes ecgPulse {
      0% { stroke-dashoffset: 300; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rotateCube {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes synapsePulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }

    .card-center { animation: floatCenter 4.2s ease-in-out infinite; transform-origin: center; }
    .card-l1 { animation: floatLeft1 3.8s ease-in-out infinite 0.4s; transform-origin: center; }
    .card-l2 { animation: floatLeft2 4.5s ease-in-out infinite 0.8s; transform-origin: center; }
    .card-r1 { animation: floatRight1 4.0s ease-in-out infinite 0.2s; transform-origin: center; }
    .card-r2 { animation: floatRight2 4.7s ease-in-out infinite 0.6s; transform-origin: center; }
    .ecg-line { stroke-dasharray: 200; animation: ecgPulse 3.5s linear infinite; }
    .star { animation: starTwinkle 3s ease-in-out infinite; }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect width="940" height="330" rx="16" fill="url(#spaceBg)"/>
  <rect width="938" height="328" x="1" y="1" rx="15" fill="none" stroke="#1f293d" stroke-width="1.5"/>

  <!-- Background Earth / Horizon Glow Arc -->
  <circle cx="470" cy="-140" r="320" fill="url(#globeGlow)"/>
  <path d="M 120,95 Q 470,180 820,95" fill="none" stroke="#1e3a8a" stroke-opacity="0.35" stroke-dasharray="3,6"/>
  <path d="M 220,115 Q 470,185 720,115" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Background Stars / Constellations -->
  <g fill="#93c5fd">
    <circle cx="90" cy="50" r="1.2" class="star" style="animation-delay: 0.2s;"/>
    <circle cx="160" cy="35" r="1.6" class="star" style="animation-delay: 1.1s;"/>
    <circle cx="280" cy="45" r="1" class="star" style="animation-delay: 2.3s;"/>
    <circle cx="680" cy="40" r="1.3" class="star" style="animation-delay: 0.8s;"/>
    <circle cx="780" cy="30" r="1.5" class="star" style="animation-delay: 1.7s;"/>
    <circle cx="850" cy="55" r="1.1" class="star" style="animation-delay: 2.1s;"/>
    <circle cx="130" cy="220" r="1" class="star" style="animation-delay: 0.5s;"/>
    <circle cx="810" cy="210" r="1.2" class="star" style="animation-delay: 1.4s;"/>
  </g>

  <!-- Synaptic Connecting Wires between Cards -->
  <path d="M 175,125 C 220,110 260,110 305,105" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-dasharray="4,4"/>
  <path d="M 305,105 C 355,100 375,90 415,85" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-dasharray="4,4"/>
  <path d="M 525,85 C 565,90 585,100 635,105" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-dasharray="4,4"/>
  <path d="M 635,105 C 680,110 720,110 765,125" fill="none" stroke="#f43f5e" stroke-opacity="0.35" stroke-dasharray="4,4"/>

  <!-- ==================== 1. CARD LEFT 2: NEUROEVOLUTION (DNA) ==================== -->
  <g class="card-l2" transform="translate(120, 75)">
    <rect width="105" height="105" rx="18" fill="url(#cardBg)" stroke="#d97706" stroke-opacity="0.5" stroke-width="1.4"/>
    <rect width="101" height="101" x="2" y="2" rx="16" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1"/>
    <!-- DNA Double Helix with Synapses -->
    <g transform="translate(52, 52) rotate(-35)" filter="url(#glow-amber)">
      <path d="M -18,-24 C -2,-12 -2,12 -18,24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 18,-24 C 2,-12 2,12 18,24" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Base rungs -->
      <line x1="-15" y1="-18" x2="15" y2="-18" stroke="#fde68a" stroke-width="1.8" stroke-opacity="0.9"/>
      <circle cx="-15" cy="-18" r="2.2" fill="#f59e0b"/>
      <circle cx="15" cy="-18" r="2.2" fill="#fbbf24"/>
      <line x1="-7" y1="-8" x2="7" y2="-8" stroke="#fde68a" stroke-width="1.8" stroke-opacity="0.9"/>
      <line x1="-5" y1="5" x2="5" y2="5" stroke="#fde68a" stroke-width="1.8" stroke-opacity="0.9"/>
      <line x1="-15" y1="18" x2="15" y2="18" stroke="#fde68a" stroke-width="1.8" stroke-opacity="0.9"/>
      <circle cx="-15" cy="18" r="2.2" fill="#f59e0b"/>
      <circle cx="15" cy="18" r="2.2" fill="#fbbf24"/>
    </g>
    <text x="52" y="94" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8.5" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="0.5">GENETIC ALGO</text>
  </g>

  <!-- ==================== 2. CARD LEFT 1: NEUROAI & SNN (BRAIN) ==================== -->
  <g class="card-l1" transform="translate(250, 55)">
    <rect width="112" height="112" rx="18" fill="url(#cardBg)" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1.4"/>
    <rect width="108" height="108" x="2" y="2" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Brain / Neural Network Hemisphere -->
    <g transform="translate(56, 52)" filter="url(#glow-cyan)">
      <!-- Left Cortical Lobe Contour -->
      <path d="M -4,-22 C -18,-22 -26,-12 -26,2 C -26,16 -16,24 -4,25" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Right Silicon Synapse Circuit -->
      <path d="M 4,-22 C 18,-22 26,-12 26,2 C 26,16 16,24 4,25" fill="none" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="0" y1="-23" x2="0" y2="25" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,3"/>
      <!-- Spiking Nodes & Synaptic Links -->
      <circle cx="-14" cy="-10" r="3" fill="#38bdf8"/>
      <circle cx="-16" cy="10" r="2.8" fill="#38bdf8"/>
      <circle cx="-7" cy="0" r="3.2" fill="#00f2fe"/>
      <line x1="-14" y1="-10" x2="-7" y2="0" stroke="#38bdf8" stroke-width="1.2"/>
      <line x1="-16" y1="10" x2="-7" y2="0" stroke="#38bdf8" stroke-width="1.2"/>
      <!-- Right silicon nodes -->
      <rect x="11" y="-12" width="6" height="6" rx="1.5" fill="#00f2fe"/>
      <rect x="13" y="8" width="6" height="6" rx="1.5" fill="#00f2fe"/>
      <circle cx="7" cy="0" r="3.2" fill="#38bdf8"/>
      <line x1="14" y1="-9" x2="7" y2="0" stroke="#00f2fe" stroke-width="1.2"/>
      <line x1="16" y1="11" x2="7" y2="0" stroke="#00f2fe" stroke-width="1.2"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#ffffff" stroke-width="1.5"/>
    </g>
    <text x="56" y="100" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">NEUROAI / SNN</text>
  </g>

  <!-- ==================== 3. HERO CENTER CARD: RESERVOIR COMPUTING ==================== -->
  <g class="card-center" transform="translate(390, 30)">
    <!-- Ambient Green Glow Behind Hero Card -->
    <circle cx="80" cy="80" r="95" fill="url(#centerGreenGlow)"/>

    <rect width="160" height="160" rx="24" fill="url(#heroCardBg)" stroke="#10b981" stroke-width="2.2" filter="url(#glow-green)"/>
    <rect width="154" height="154" x="3" y="3" rx="21" fill="none" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.2"/>

    <!-- Glowing Futuristic Isometric Reservoir Matrix -->
    <g transform="translate(80, 75)">
      <!-- Base pedestal reflection ring -->
      <ellipse cx="0" cy="42" rx="34" ry="10" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
      <ellipse cx="0" cy="42" rx="46" ry="14" fill="none" stroke="#34d399" stroke-opacity="0.2" stroke-dasharray="3,4"/>

      <!-- 3D Isometric Reservoir Cube Geometry -->
      <!-- Top Face -->
      <polygon points="0,-36 32,-18 0,0 -32,-18" fill="#065f46" fill-opacity="0.6" stroke="#34d399" stroke-width="1.8"/>
      <!-- Left Face -->
      <polygon points="-32,-18 0,0 0,36 -32,18" fill="#047857" fill-opacity="0.7" stroke="#10b981" stroke-width="1.8"/>
      <!-- Right Face -->
      <polygon points="0,0 32,-18 32,18 0,36" fill="#059669" fill-opacity="0.8" stroke="#34d399" stroke-width="1.8"/>

      <!-- Internal Recurrent Reservoir Dynamic Attractors -->
      <circle cx="0" cy="-18" r="4.5" fill="#ecfdf5" filter="url(#glow-green)"/>
      <circle cx="-16" cy="9" r="3.8" fill="#6ee7b7"/>
      <circle cx="16" cy="9" r="3.8" fill="#6ee7b7"/>
      <circle cx="0" cy="18" r="3.2" fill="#a7f3d0"/>

      <!-- Recurrent Trajectory Lines (Echo State dynamics) -->
      <path d="M 0,-18 Q -12,0 -16,9" fill="none" stroke="#a7f3d0" stroke-width="1.5"/>
      <path d="M -16,9 Q 0,8 16,9" fill="none" stroke="#ecfdf5" stroke-width="1.5"/>
      <path d="M 16,9 Q 12,-10 0,-18" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
      <line x1="0" y1="18" x2="0" y2="-18" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2,2"/>
    </g>

    <!-- Subtitle on Hero Card -->
    <text x="80" y="146" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="800" fill="#10b981" text-anchor="middle" letter-spacing="1">RESERVOIR COMPUTING</text>
    <text x="80" y="133" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="600" fill="#6ee7b7" text-anchor="middle" letter-spacing="1.5">ECHO STATE NETWORKS</text>
  </g>

  <!-- ==================== 4. CARD RIGHT 1: ECG BIO-TELEMETRY ==================== -->
  <g class="card-r1" transform="translate(578, 55)">
    <rect width="112" height="112" rx="18" fill="url(#cardBg)" stroke="#e11d48" stroke-opacity="0.5" stroke-width="1.4"/>
    <rect width="108" height="108" x="2" y="2" rx="16" fill="none" stroke="#f43f5e" stroke-opacity="0.15" stroke-width="1"/>
    <!-- ECG Heartbeat Monitor Wave -->
    <g transform="translate(14, 52)" filter="url(#glow-rose)">
      <!-- Background ECG Grid -->
      <line x1="0" y1="0" x2="84" y2="0" stroke="#881337" stroke-opacity="0.5" stroke-width="1"/>
      <line x1="28" y1="-18" x2="28" y2="18" stroke="#881337" stroke-opacity="0.3" stroke-width="0.8"/>
      <line x1="56" y1="-18" x2="56" y2="18" stroke="#881337" stroke-opacity="0.3" stroke-width="0.8"/>
      <!-- Realistic P-Q-R-S-T Cardiac Wave -->
      <path class="ecg-line" d="M 0,0 L 16,0 Q 20,-5 24,0 L 29,0 L 32,5 L 38,-26 L 43,14 L 46,-3 L 50,0 Q 56,-8 62,0 L 84,0" 
            fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="38" cy="-26" r="3.2" fill="#ffffff"/>
    </g>
    <text x="56" y="100" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8.5" font-weight="700" fill="#f43f5e" text-anchor="middle" letter-spacing="0.5">ECG TELEMETRY</text>
  </g>

  <!-- ==================== 5. CARD RIGHT 2: COMPUTER VISION & GNN ==================== -->
  <g class="card-r2" transform="translate(715, 75)">
    <rect width="105" height="105" rx="18" fill="url(#cardBg)" stroke="#9333ea" stroke-opacity="0.5" stroke-width="1.4"/>
    <rect width="101" height="101" x="2" y="2" rx="16" fill="none" stroke="#a855f7" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Graph Neural Network & Vision Transformer Lattice -->
    <g transform="translate(52, 52)" filter="url(#glow-purple)">
      <!-- Graph Node Edges -->
      <line x1="-16" y1="-14" x2="16" y2="-14" stroke="#c084fc" stroke-width="1.4"/>
      <line x1="-16" y1="-14" x2="0" y2="16" stroke="#c084fc" stroke-width="1.4"/>
      <line x1="16" y1="-14" x2="0" y2="16" stroke="#c084fc" stroke-width="1.4"/>
      <line x1="0" y1="-4" x2="-16" y2="-14" stroke="#e9d5ff" stroke-width="1.2"/>
      <line x1="0" y1="-4" x2="16" y2="-14" stroke="#e9d5ff" stroke-width="1.2"/>
      <line x1="0" y1="-4" x2="0" y2="16" stroke="#e9d5ff" stroke-width="1.2"/>
      <!-- Graph Nodes -->
      <circle cx="-16" cy="-14" r="4.2" fill="#a855f7"/>
      <circle cx="16" cy="-14" r="4.2" fill="#a855f7"/>
      <circle cx="0" cy="16" r="4.2" fill="#a855f7"/>
      <circle cx="0" cy="-4" r="5" fill="#f3e8ff"/>
      <!-- Outer Vision bounding brackets -->
      <path d="M -22,-20 L -25,-20 L -25,-15" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
      <path d="M 22,-20 L 25,-20 L 25,-15" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
      <path d="M -22,20 L -25,20 L -25,15" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
      <path d="M 22,20 L 25,20 L 25,15" fill="none" stroke="#e9d5ff" stroke-width="1.5"/>
    </g>
    <text x="52" y="94" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8.5" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="0.5">VISION &amp; GNN</text>
  </g>

  <!-- ==================== BOTTOM TYPOGRAPHY & BRANDING ==================== -->
  <g transform="translate(470, 245)" text-anchor="middle">
    <!-- Top Micro Category Badge -->
    <rect x="-140" y="-19" width="280" height="18" rx="9" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8"/>
    <text x="0" y="-7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8" font-weight="700" fill="#38bdf8" letter-spacing="2">
      NEUROSCIENCE-INSPIRED ARTIFICIAL INTELLIGENCE
    </text>

    <!-- Main Title -->
    <text x="0" y="24" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1">
      NeuroAI &amp; Neuromorphic Computing Research
    </text>

    <!-- Research Pillars Subtitle -->
    <text x="0" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Reservoir Computing (ESNs) <tspan fill="#38bdf8">•</tspan> Spiking Neural Networks <tspan fill="#10b981">•</tspan> Real-Time ECG Telemetry <tspan fill="#f43f5e">•</tspan> Vision Transformers &amp; GNNs
    </text>
  </g>
</svg>